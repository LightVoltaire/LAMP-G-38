<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>COP 4331 LAMP Stack Project</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
    <link rel="alternate icon" href="favicon.ico">
    <!-- Custom Styles -->
    <link href="css/styles.css" rel="stylesheet">
    <!-- Scripts -->
    <script type="text/javascript" src="js/code.js"></script>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100 py-5">
    <div class="background-glow"></div>
    <main class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-5">
                
                <!-- Title Header -->
                <div class="text-center mb-4">
                    <div class="app-icon-wrapper mb-3 mx-auto">
                        <i class="bi bi-person-plus-fill"></i>
                    </div>
                    <h1 id="title" class="fw-bold tracking-tight">COP 4331 LAMP Stack Project Group 38</h1>
                    <p class="text-secondary-contrast small">Employee Manager Portal</p>
                </div>

                <!-- Sign Up Card -->
                <div id="signupDiv" class="card glass-card shadow-lg border-0 p-4 p-sm-5">
                    <div class="card-body p-0">
                        <span id="inner-title" class="d-block text-center fw-semibold text-uppercase tracking-wider mb-4 fs-5">Create an Account</span>
                        
                        <form id="signupForm" onsubmit="event.preventDefault(); doRegister();" class="needs-validation">
                            <!-- First Name Input Group -->
                            <div class="mb-3">
                                <label for="signupFirstName" class="form-label form-label-contrast small">First Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text text-secondary-contrast"></i></span>
                                    <input type="text" id="signupFirstName" class="form-control" placeholder="Enter first name" required />
                                </div>
                            </div>

                            <!-- Last Name Input Group -->
                            <div class="mb-3">
                                <label for="signupLastName" class="form-label form-label-contrast small">Last Name</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-card-text text-secondary-contrast"></i></span>
                                    <input type="text" id="signupLastName" class="form-control" placeholder="Enter last name" required />
                                </div>
                            </div>

                            <!-- Username Input Group -->
                            <div class="mb-3">
                                <label for="signupName" class="form-label form-label-contrast small">Username</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-person text-secondary-contrast"></i></span>
                                    <input type="text" id="signupName" class="form-control" placeholder="Choose a username" required />
                                </div>
                            </div>
                            
                            <!-- Password Input Group -->
                            <div class="mb-4">
                                <label for="signupPassword" class="form-label form-label-contrast small">Password</label>
                                <div class="input-group">
                                    <span class="input-group-text"><i class="bi bi-lock text-secondary-contrast"></i></span>
                                    <input type="password" id="signupPassword" class="form-control" placeholder="Create a password" required />
                                </div>
                            </div>

                            <!-- Register Button -->
                            <button type="submit" id="registerButton" class="buttons btn btn-primary w-100 py-3 fw-semibold rounded-3 shadow-sm d-flex align-items-center justify-content-center gap-2">
                                <span>Sign Up</span>
                                <i class="bi bi-arrow-right"></i>
                            </button>
                        </form>

                        <!-- Sign In Link -->
                        <div class="text-center mt-3">
                            <span class="small text-secondary-contrast">
                                Already have an account?
                                <a href="index.html" class="text-decoration-none fw-semibold">Sign In</a>
                            </span>
                        </div>

                        <!-- Feedback Result Message -->
                        <div class="mt-3 text-center">
                            <span id="signupResult" class="small fw-semibold"></span>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
