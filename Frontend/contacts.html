<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Contacts</title>
  <link rel="icon" href="data:,">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Same libraries code.js's icon/utility classes (bi-*, fw-semibold, text-success...) expect -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-page" onload="readCookie(); showAdminLink()">
  <div class="background-glow"></div>

  <nav class="dashboard-topbar">
    <div class="container-xl d-flex justify-content-between align-items-center gap-3 py-3">
      <a class="brand-mark" href="contacts.html"><span class="brand-icon"><i class="bi bi-person-lines-fill"></i></span><span>Group 38 <small>Contacts manager</small></span></a>
      <div class="d-flex align-items-center gap-3">
        <span id="userName" class="small muted-label d-none d-sm-inline"></span>
        <a id="adminLink" class="btn btn-outline-light btn-sm d-none" href="admin.html">Admin workspace</a>
        <button type="button" class="btn btn-outline-light btn-sm" onclick="doLogout()">
          <i class="bi bi-box-arrow-right me-1"></i>Log out
        </button>
      </div>
    </div>
  </nav>

  <main class="container-xl py-4 py-lg-5">
    <div class="mb-4"><div class="eyebrow">YOUR WORKSPACE</div><h1 class="page-title mb-1">My contacts</h1><p class="muted-label mb-0">Find someone quickly, or add a new person to your list.</p></div>

    <div class="dashboard-columns">
    <!-- Search table -->
    <div class="card surface-card directory-card">
      <div class="card-body">
        <div class="eyebrow">DIRECTORY</div>
        <h2 class="h4 fw-bold mb-3">Your people</h2>
        <label class="visually-hidden" for="searchText">Search contacts by name, email, or phone</label>
        <div class="input-group mb-2">
          <span class="input-group-text"><i class="bi bi-search" aria-hidden="true"></i></span>
          <input class="form-control" id="searchText" type="search" placeholder="Search name, email, or phone…" oninput="searchContacts()">
        </div>
        <span id="contactsSearchResult" class="small" role="status" aria-live="polite"></span>

        <div class="table-responsive mt-2">
          <table class="table dashboard-table table-hover align-middle mb-0">
            <thead><tr><th scope="col">Name</th><th scope="col">Details</th><th scope="col" class="text-end">Actions</th></tr></thead>
            <tbody id="contactsBody"></tbody>
          </table>
        </div>
        <div id="contactsEmpty" class="text-center text-secondary py-5 d-none">
          <i class="bi bi-inbox fs-2 d-block mb-2" aria-hidden="true"></i>
          No contacts found. Add someone or try a different search.
        </div>
      </div>
    </div>

    <!-- Making Contact Section-->
    <div class="card surface-card add-card">
      <div class="card-body">
        <!--Subtitle-->
        <div class="eyebrow">NEW CONTACT</div><h2 class="h4 fw-bold mb-3">Add a contact</h2>
        <form id="addContactForm" onsubmit="event.preventDefault(); addContact();">
          <div class="row g-3 align-items-end">
            <div class="col-sm-6">
              <!--First Name in Text Box-->
              <label class="form-label small" for="newFirstName">First Name</label>
              <input class="form-control" id="newFirstName" type="text" placeholder="First Name">
            </div>
            <!--Last Name in Text Box-->
            <div class="col-sm-6">
              <label class="form-label small" for="newLastName">Last Name</label>
              <input class="form-control" id="newLastName" type="text" placeholder="Last Name">
            </div>
            <div class="col-sm-6">
              <label class="form-label small" for="newEmail">Email</label>
              <input class="form-control" id="newEmail" type="email" placeholder="Email">
            </div>
            <div class="col-sm-6">
              <label class="form-label small" for="newPhone">Phone</label>
              <input class="form-control" id="newPhone" type="tel" placeholder="(123)-456-7890">
            </div>
            <div class="col-12 d-grid mt-4">
              <button type="submit" class="btn btn-primary">
                <i class="bi bi-plus-lg me-1"></i>Add contact
              </button>
            </div>
          </div>
          <div id="contactAddResult" class="mt-2" role="status" aria-live="polite"></div>
        </form>
      </div>
    </div>

    </div>
  </main>

  <!-- Edit contact -->
  <div class="modal fade" id="editContactModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content surface-card">
        <div class="modal-header">
          <h2 class="modal-title h5">Edit contact</h2>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div id="editContactResult" class="mb-2"></div>
          <div class="row g-3">
            <div class="col-sm-6">
              <label class="form-label small" for="editFirstName">First Name</label>
              <input class="form-control" id="editFirstName" type="text">
            </div>
            <div class="col-sm-6">
              <label class="form-label small" for="editLastName">Last Name</label>
              <input class="form-control" id="editLastName" type="text">
            </div>
            <div class="col-12">
              <label class="form-label small" for="editEmail">Email</label>
              <input class="form-control" id="editEmail" type="email">
            </div>
            <div class="col-12">
              <label class="form-label small" for="editPhone">Phone</label>
              <input class="form-control" id="editPhone" type="tel">
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-outline-light" data-bs-dismiss="modal">Cancel</button>
          <button type="button" class="btn btn-primary" onclick="updateContact()">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <!-- code.js and contacts.js -->
  <script src="js/code.js"></script>
  <script src="js/contacts.js"></script>
  <script>
    async function showAdminLink() {
      try {
        const response = await fetch('/api/admin.php?action=me', { credentials: 'same-origin' });
        if (response.ok) document.getElementById('adminLink').classList.remove('d-none');
      } catch (_) { /* Admin link stays hidden. */ }
    }
  </script>
</body>
</html>
